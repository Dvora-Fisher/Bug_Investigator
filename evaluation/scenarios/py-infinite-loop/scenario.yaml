id: py-infinite-loop
language: Python
category: infinite-loop
bug:
  description: >
    The price lookup service hangs forever (100% CPU, request never returns) when a customer searches
    for a price above the first item, e.g. first_at_least([1, 3, 5, 7], 6). Small targets work fine.
  error_output: ""
expected:
  file: search/bisect_tools.py
  symbol: first_at_least
  root_cause: When sorted_values[mid] < target the code sets lo = mid instead of mid + 1, so when hi == lo + 1 the range never shrinks and the loop never ends.
  fix: Set lo = mid + 1.
reference_fix:
  - path: search/bisect_tools.py
    old: "            lo = mid\n"
    new: "            lo = mid + 1\n"
