id: py-sql
language: Python
category: sql
bug:
  description: >
    The "my orders" page fails for customers whose name contains an apostrophe, such as O'Brien.
    Everyone else sees their orders normally.
  error_output: |
    sqlite3.OperationalError: near "Brien": syntax error
      File "/srv/shop/orders.py", line 21, in orders_for
        return conn.execute(query).fetchall()
expected:
  file: shop/orders.py
  symbol: orders_for
  root_cause: The query is built with an f-string, so a quote in the customer name breaks the SQL (and allows SQL injection).
  fix: Use a parameterized query (WHERE customer = ?) with the name passed as a parameter.
reference_fix:
  - path: shop/orders.py
    old: |2
          query = f"SELECT id, total FROM orders WHERE customer = '{customer}' ORDER BY id"
          return conn.execute(query).fetchall()
    new: |2
          query = "SELECT id, total FROM orders WHERE customer = ? ORDER BY id"
          return conn.execute(query, (customer,)).fetchall()
